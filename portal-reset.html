<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>ScanGuru — Reset password</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1F2937;color:#F1F5F9;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.card{background:#2B3545;border:1px solid #3F4B5E;border-radius:16px;padding:32px;width:min(420px,92vw)}h1{font-size:20px;margin:0 0 6px}p{color:#94A3B8;font-size:14px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}input{width:100%;box-sizing:border-box;background:#1F2937;color:#F1F5F9;border:1px solid #3F4B5E;border-radius:8px;padding:11px 12px;font:inherit}
button{width:100%;margin-top:18px;background:#57B7A3;color:#fff;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
.msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:8px}.ok{background:#064E3B;color:#6EE7B7}.err{background:#7F1D1D;color:#FCA5A5}a{color:#57B7A3}</style></head><body>
<div class="card" id="c"></div>
<script>
const API='https://scanguru-portal-api-production.up.railway.app/api/v1/auth';
const q=new URLSearchParams(location.search), e=q.get('e'), t=q.get('t'); const c=document.getElementById('c');
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
if(e&&t){ c.innerHTML=`<h1>Choose a new password</h1><p>for <b>${esc(e)}</b></p><label>New password (min 10 characters)</label><input id="p1" type="password" autocomplete="new-password"><label>Repeat</label><input id="p2" type="password" autocomplete="new-password"><button id="go">Set password</button><div id="m"></div>`;
  document.getElementById('go').onclick=async()=>{const p1=p1v(),p2=document.getElementById('p2').value;const m=document.getElementById('m');
    if(p1.length<10)return m.innerHTML='<div class="msg err">At least 10 characters.</div>'; if(p1!==p2)return m.innerHTML='<div class="msg err">Passwords do not match.</div>';
    document.getElementById('go').disabled=true;
    const r=await fetch(API+'/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,token:t,new_password:p1})}); const d=await r.json().catch(()=>({}));
    m.innerHTML=r.ok?'<div class="msg ok">Password updated. <a href="portal-login.html">Sign in →</a></div>':`<div class="msg err">${esc(d.detail||'Could not reset.')} <a href="portal-reset.html">Request a new link</a></div>`; };
  function p1v(){return document.getElementById('p1').value;}
}else{ c.innerHTML=`<h1>Forgot your password?</h1><p>Enter your ScanGuru email and we'll send a reset link (valid 1 hour).</p><label>Email</label><input id="em" type="email" autocomplete="email"><button id="go">Send reset link</button><div id="m"></div><p style="margin-top:16px"><a href="portal-login.html">← Back to sign in</a></p>`;
  document.getElementById('go').onclick=async()=>{const em=document.getElementById('em').value.trim();const m=document.getElementById('m');if(!em)return;document.getElementById('go').disabled=true;
    const r=await fetch(API+'/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})}); const d=await r.json().catch(()=>({}));
    m.innerHTML=r.ok?`<div class="msg ok">${esc(d.message)}</div>`:`<div class="msg err">${esc(d.detail||'Try again later.')}</div>`; }; }
</script></body></html>
